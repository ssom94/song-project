<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<title>Admin Login | SONG</title>
	<link rel="stylesheet" href="/assets/css/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/login.css" />
</head>
<body class="admin-page admin-login-page">
	<a class="login-page-home" href="/">Home</a>

	<main class="admin-card login-card" aria-labelledby="login-title">
		<a class="admin-logo login-logo" href="/" aria-label="Home">
			<img src="/assets/logo-song-ym.png" alt="Song YM" />
		</a>

		<h1 id="login-title" class="login-title">管理者ログイン</h1>
		<p class="login-subtitle">ブログ管理画面にアクセスするため、管理者アカウントでログインしてください。</p>

		<form id="login-form" novalidate>
			<div class="login-field">
				<label class="admin-form-label" for="username">ユーザー名</label>
				<input class="admin-input" id="username" name="username" type="text" autocomplete="username" required maxlength="100" />
			</div>

			<div class="login-field">
				<label class="admin-form-label" for="password">パスワード</label>
				<div class="password-input-wrap">
					<input class="admin-input password-input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" />
					<button class="password-toggle" id="password-toggle" type="button" aria-label="パスワードを表示" aria-pressed="false">
						<svg class="password-icon password-icon-show" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
							<circle cx="12" cy="12" r="3" />
						</svg>
						<svg class="password-icon password-icon-hide" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M3 3l18 18" />
							<path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a17.4 17.4 0 0 1-3 3.6M6.2 6.2C3.8 8 2.5 12 2.5 12S6 18 12 18a9.8 9.8 0 0 0 3.3-.6" />
							<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
						</svg>
					</button>
				</div>
			</div>

			<label class="login-remember" for="remember-me">
				<input id="remember-me" name="rememberMe" type="checkbox" />
				ログイン状態を保持する
			</label>

			<button class="admin-button-primary login-submit" id="submit-button" type="submit">ログイン</button>
			<p id="status" class="login-status" role="status" aria-live="polite"></p>
		</form>
	</main>

	<script>
		const form = document.getElementById('login-form');
		const usernameInput = document.getElementById('username');
		const passwordInput = document.getElementById('password');
		const passwordToggle = document.getElementById('password-toggle');
		const rememberInput = document.getElementById('remember-me');
		const submitButton = document.getElementById('submit-button');
		const status = document.getElementById('status');

		function setStatus(message, success = false) {
			status.textContent = message;
			status.classList.toggle('success', success);
		}

		passwordToggle.addEventListener('click', () => {
			const showPassword = passwordInput.type === 'password';
			passwordInput.type = showPassword ? 'text' : 'password';
			passwordToggle.classList.toggle('is-visible', showPassword);
			passwordToggle.setAttribute('aria-pressed', String(showPassword));
			passwordToggle.setAttribute('aria-label', showPassword ? 'パスワードを非表示' : 'パスワードを表示');
			passwordInput.focus({ preventScroll: true });
		});

		async function checkSession() {
			try {
				const response = await fetch('/api/admin/auth/session', {
					method: 'GET',
					credentials: 'same-origin',
					cache: 'no-store',
				});
				if (!response.ok) return;
				const data = await response.json();
				if (data.authenticated) {
					window.location.replace('/admin/');
				}
			} catch {
				// The login form remains usable even if the session check fails.
			}
		}

		form.addEventListener('submit', async (event) => {
			event.preventDefault();
			setStatus('');

			const username = usernameInput.value.trim();
			const password = passwordInput.value;
			if (!username || !password) {
				setStatus('ユーザー名とパスワードを入力してください。');
				return;
			}

			submitButton.disabled = true;
			submitButton.textContent = 'ログイン中…';

			try {
				const response = await fetch('/api/admin/auth/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					credentials: 'same-origin',
					body: JSON.stringify({
						username,
						password,
						rememberMe: rememberInput.checked,
					}),
				});
				const data = await response.json().catch(() => ({}));

				if (response.ok && data.authenticated) {
					passwordInput.value = '';
					window.location.replace('/admin/');
					return;
				}

				if (data.error === 'TWO_FACTOR_REQUIRED') {
					setStatus('2段階認証が必要です。');
					return;
				}

				setStatus('ユーザー名またはパスワードが正しくありません。');
			} catch {
				setStatus('通信に失敗しました。しばらくしてから再度お試しください。');
			} finally {
				submitButton.disabled = false;
				submitButton.textContent = 'ログイン';
			}
		});

		checkSession();
	</script>
</body>
</html>
