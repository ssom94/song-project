<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<title>Admin Login | SONG</title>
	<link rel="stylesheet" href="/admin/login/login.css" />
</head>
<body>
	<main class="card" aria-labelledby="login-title">
		<div class="login-logo">
			<img src="/assets/logo-song-ym.png" alt="Song YM" />
		</div>

		<h1 id="login-title">管理者ログイン</h1>
		<p class="subtitle">ブログ管理画面にアクセスするため、管理者アカウントでログインしてください。</p>

		<form id="login-form" novalidate>
			<div class="field">
				<label for="username">ユーザー名</label>
				<input id="username" name="username" type="text" autocomplete="username" required maxlength="100" />
			</div>

			<div class="field">
				<label for="password">パスワード</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" />
			</div>

			<label class="remember" for="remember-me">
				<input id="remember-me" name="rememberMe" type="checkbox" />
				ログイン状態を保持する
			</label>

			<button id="submit-button" type="submit">ログイン</button>
			<p id="status" class="status" role="status" aria-live="polite"></p>
		</form>
	</main>

	<script>
		const form = document.getElementById('login-form');
		const usernameInput = document.getElementById('username');
		const passwordInput = document.getElementById('password');
		const rememberInput = document.getElementById('remember-me');
		const submitButton = document.getElementById('submit-button');
		const status = document.getElementById('status');

		function setStatus(message, success = false) {
			status.textContent = message;
			status.classList.toggle('success', success);
		}

		async function checkSession() {
			try {
				const response = await fetch('/api/admin/auth/session', {
					method: 'GET',
					credentials: 'same-origin',
					cache: 'no-store',
				});
				if (!response.ok) return;
				const data = await response.json();
				if (data.authenticated) {
					setStatus(`ログイン済みです: ${data.admin.displayName ?? data.admin.username}`, true);
				}
			} catch {
				// The login form remains usable even if the session check fails.
			}
		}

		form.addEventListener('submit', async (event) => {
			event.preventDefault();
			setStatus('');

			const username = usernameInput.value.trim();
			const password = passwordInput.value;
			if (!username || !password) {
				setStatus('ユーザー名とパスワードを入力してください。');
				return;
			}

			submitButton.disabled = true;
			submitButton.textContent = 'ログイン中…';

			try {
				const response = await fetch('/api/admin/auth/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					credentials: 'same-origin',
					body: JSON.stringify({
						username,
						password,
						rememberMe: rememberInput.checked,
					}),
				});
				const data = await response.json().catch(() => ({}));

				if (response.ok && data.authenticated) {
					passwordInput.value = '';
					setStatus('ログインしました。', true);
					return;
				}

				if (data.error === 'TWO_FACTOR_REQUIRED') {
					setStatus('2段階認証が必要です。');
					return;
				}

				setStatus('ユーザー名またはパスワードが正しくありません。');
			} catch {
				setStatus('通信に失敗しました。しばらくしてから再度お試しください。');
			} finally {
				submitButton.disabled = false;
				submitButton.textContent = 'ログイン';
			}
		});

		checkSession();
	</script>
</body>
</html>
