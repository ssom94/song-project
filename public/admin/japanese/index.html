<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<title>Japanese Learning | SONG Admin</title>
	<link rel="stylesheet" href="/assets/css/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/japanese-common.css" />
	<link rel="stylesheet" href="/assets/css/admin/japanese.css" />
</head>
<body class="admin-page admin-japanese-page" data-i18n-scope="japanese">
	<div id="admin-loading" class="admin-loading" data-i18n="loading">セッションを確認しています…</div>

	<div id="admin-shell" class="admin-shell" hidden>
		<header class="admin-global-header">
			<div class="admin-header-left">
				<button id="admin-sidebar-toggle" class="admin-sidebar-toggle" type="button" aria-controls="admin-sidebar" aria-expanded="true" aria-label="管理メニューを閉じる" data-i18n-aria-label="menuCloseLabel">
					<span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
				</button>
				<a class="admin-global-brand" href="/" aria-label="Song Project ホームへ" data-i18n-aria-label="brandHomeLabel">
					<img src="/assets/logo-song-ym.png" alt="Song YM" />
					<span>SONG Admin</span>
				</a>
			</div>
			<div class="admin-header-actions">
				<div class="admin-language-switch" aria-label="表示言語" data-i18n-aria-label="languageLabel">
					<button class="is-active" type="button" data-admin-lang="ja" aria-pressed="true">日本語</button>
					<span class="admin-language-divider" aria-hidden="true">|</span>
					<button type="button" data-admin-lang="ko" aria-pressed="false">한국어</button>
				</div>
				<div class="admin-user-menu-wrap">
					<button id="admin-user-toggle" class="admin-user-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="admin-user-menu">
						<img class="admin-user-icon" src="/assets/icons/user.svg" alt="" aria-hidden="true" />
						<span id="admin-user" class="admin-user"></span>
						<span class="admin-user-chevron" aria-hidden="true"></span>
					</button>
					<div id="admin-user-menu" class="admin-user-menu" hidden>
						<div class="admin-user-menu-info"><strong id="admin-user-menu-name"></strong><span id="admin-user-menu-email"></span></div>
						<button id="admin-logout" class="admin-logout-button" type="button" data-i18n="logout">ログアウト</button>
					</div>
				</div>
			</div>
		</header>

		<div class="admin-header-accent" aria-hidden="true"></div>
		<div class="admin-body">
			<aside id="admin-sidebar" class="admin-sidebar">
				<p class="admin-nav-label" data-i18n="management">管理</p>
				<nav id="admin-nav" class="admin-nav" aria-label="管理メニュー" data-i18n-aria-label="navLabel"></nav>
				<div class="admin-sidebar-footer"><a href="/" data-i18n="viewSite">サイトを表示</a></div>
			</aside>
			<button id="admin-sidebar-backdrop" class="admin-sidebar-backdrop" type="button" tabindex="-1" aria-label="管理メニューを閉じる" data-i18n-aria-label="menuCloseLabel" hidden></button>

			<main class="admin-main">
				<section class="admin-content">
					<div class="admin-page-heading">
						<h1 data-i18n="japaneseWordsPageTitle">日本語学習・単語管理</h1>
						<p data-i18n="japaneseWordsPageDescription">単語、読み方、意味、JLPT、品詞、例文を管理します。</p>
					</div>

					<nav class="admin-japanese-tabs" aria-label="Japanese learning management">
						<a class="admin-japanese-tab is-active" href="/admin/japanese/" aria-current="page">単語</a>
						<a class="admin-japanese-tab" href="/admin/japanese/parts/">品詞</a>
					</nav>

					<div class="admin-japanese-layout">
						<section class="admin-japanese-card admin-japanese-form-card">
							<div class="admin-japanese-card-header">
								<h2 id="japanese-word-form-title" data-i18n="japaneseWordCreateTitle">単語を追加</h2>
								<button id="japanese-word-new" class="admin-japanese-text-button" type="button" data-i18n="japaneseWordNew">新規</button>
							</div>

							<form id="japanese-word-form" class="admin-japanese-form">
								<div class="admin-japanese-field">
									<label for="japanese-word" data-i18n="japaneseWord">単語</label>
									<input id="japanese-word" type="text" maxlength="120" autocomplete="off" data-i18n-placeholder="japaneseWordPlaceholder" placeholder="例：扱う" />
								</div>
								<div class="admin-japanese-field">
									<label for="japanese-reading" data-i18n="japaneseReading">読み方</label>
									<input id="japanese-reading" type="text" maxlength="160" autocomplete="off" data-i18n-placeholder="japaneseReadingPlaceholder" placeholder="例：あつかう" />
								</div>
								<div class="admin-japanese-field">
									<label for="japanese-meaning-ko" data-i18n="japaneseMeaningKo">韓国語の意味</label>
									<textarea id="japanese-meaning-ko" rows="3" maxlength="500" data-i18n-placeholder="japaneseMeaningKoPlaceholder"></textarea>
								</div>
								<div class="admin-japanese-field">
									<label for="japanese-meaning-ja" data-i18n="japaneseMeaningJa">日本語の説明</label>
									<textarea id="japanese-meaning-ja" rows="2" maxlength="500" data-i18n-placeholder="japaneseMeaningJaPlaceholder"></textarea>
								</div>

								<div class="admin-japanese-field-row">
									<div class="admin-japanese-field">
										<label for="japanese-jlpt" data-i18n="japaneseJlpt">JLPT</label>
										<select id="japanese-jlpt"><option value="" data-i18n="japaneseJlptNone">未指定</option></select>
									</div>
									<div class="admin-japanese-field">
										<label for="japanese-pos" data-i18n="japanesePartOfSpeech">品詞</label>
										<select id="japanese-pos"><option value="" data-i18n="japanesePartOfSpeechNone">未指定</option></select>
									</div>
								</div>

								<div class="admin-japanese-divider"></div>
								<div class="admin-japanese-field">
									<label for="japanese-example" data-i18n="japaneseExample">例文</label>
									<textarea id="japanese-example" rows="3" maxlength="1000" data-i18n-placeholder="japaneseExamplePlaceholder"></textarea>
								</div>
								<div class="admin-japanese-field">
									<label for="japanese-example-reading" data-i18n="japaneseExampleReading">例文の読み方</label>
									<textarea id="japanese-example-reading" rows="2" maxlength="1200" data-i18n-placeholder="japaneseExampleReadingPlaceholder"></textarea>
								</div>
								<div class="admin-japanese-field">
									<label for="japanese-example-ko" data-i18n="japaneseExampleTranslation">例文の韓国語訳</label>
									<textarea id="japanese-example-ko" rows="2" maxlength="1200" data-i18n-placeholder="japaneseExampleTranslationPlaceholder"></textarea>
								</div>
								<div class="admin-japanese-field">
									<label for="japanese-note" data-i18n="japaneseNote">メモ</label>
									<textarea id="japanese-note" rows="3" maxlength="2000" data-i18n-placeholder="japaneseNotePlaceholder"></textarea>
								</div>

								<p id="japanese-word-form-status" class="admin-japanese-form-status" hidden></p>
								<div class="admin-japanese-form-actions">
									<button id="japanese-word-cancel" class="admin-japanese-button" type="button" hidden data-i18n="japaneseWordCancelEdit">編集をキャンセル</button>
									<button id="japanese-word-save" class="admin-japanese-button admin-japanese-button-primary" type="submit" data-i18n="japaneseWordAdd">追加</button>
								</div>
							</form>
						</section>

						<section class="admin-japanese-card admin-japanese-list-card">
							<div class="admin-japanese-card-header admin-japanese-list-header">
								<div><h2 data-i18n="japaneseWordListTitle">単語一覧</h2><p data-i18n="japaneseWordListHint">単語・読み方・意味で検索できます。</p></div>
								<span id="japanese-word-count" class="admin-japanese-count">0</span>
							</div>

							<div class="admin-japanese-filters">
								<div class="admin-japanese-field">
									<label for="japanese-word-search" data-i18n="japaneseWordSearch">単語を検索</label>
									<input id="japanese-word-search" type="search" autocomplete="off" data-i18n-placeholder="japaneseWordSearchPlaceholder" />
								</div>
								<div class="admin-japanese-field">
									<label for="japanese-jlpt-filter" data-i18n="japaneseJlpt">JLPT</label>
									<select id="japanese-jlpt-filter"><option value="" data-i18n="filterStatusAll">すべての状態</option></select>
								</div>
							</div>

							<div id="japanese-words-loading" class="admin-japanese-empty" data-i18n="japaneseWordsLoading">単語を読み込んでいます…</div>
							<div id="japanese-words-empty" class="admin-japanese-empty" hidden data-i18n="japaneseWordsEmpty">登録済みの単語はありません。</div>
							<div id="japanese-words-filtered-empty" class="admin-japanese-empty" hidden data-i18n="japaneseWordsFilteredEmpty">条件に一致する単語がありません。</div>
							<div id="japanese-word-table-wrap" class="admin-japanese-table-wrap" hidden>
								<table class="admin-japanese-table">
									<thead><tr>
										<th data-i18n="japaneseWordTableWord">単語</th>
										<th data-i18n="japaneseWordTableReading">読み方</th>
										<th data-i18n="japaneseWordTableMeaning">意味</th>
										<th data-i18n="japaneseWordTableJlpt">JLPT</th>
										<th data-i18n="japaneseWordTablePos">品詞</th>
										<th data-i18n="tableActions">操作</th>
									</tr></thead>
									<tbody id="japanese-word-table-body"></tbody>
								</table>
							</div>
						</section>
					</div>
				</section>
			</main>
		</div>
	</div>

	<script src="/assets/js/admin/i18n.js"></script>
	<script src="/assets/js/admin/menu.js"></script>
	<script src="/assets/js/admin/layout.js"></script>
	<script src="/assets/js/admin/common.js"></script>
	<script src="/assets/js/admin/japanese.js"></script>
</body>
</html>
