<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<title>Tags | SONG Admin</title>
	<link rel="stylesheet" href="/assets/css/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/taxonomy.css" />
	<link rel="stylesheet" href="/assets/css/admin/tags.css" />
</head>
<body class="admin-page admin-tags-page" data-i18n-scope="tags">
	<div id="admin-loading" class="admin-loading" data-i18n="loading">セッションを確認しています…</div>

	<div id="admin-shell" class="admin-shell" hidden>
		<header class="admin-global-header">
			<div class="admin-header-left">
				<button id="admin-sidebar-toggle" class="admin-sidebar-toggle" type="button" aria-controls="admin-sidebar" aria-expanded="true" aria-label="管理メニューを閉じる" data-i18n-aria-label="menuCloseLabel">
					<span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
				</button>
				<a class="admin-global-brand" href="/" aria-label="Song Project ホームへ" data-i18n-aria-label="brandHomeLabel">
					<img src="/assets/logo-song-ym.png" alt="Song YM" />
					<span>SONG Admin</span>
				</a>
			</div>

			<div class="admin-header-actions">
				<div class="admin-language-switch" aria-label="表示言語" data-i18n-aria-label="languageLabel">
					<button class="is-active" type="button" data-admin-lang="ja" aria-pressed="true">日本語</button>
					<span class="admin-language-divider" aria-hidden="true">|</span>
					<button type="button" data-admin-lang="ko" aria-pressed="false">한국어</button>
				</div>
				<div class="admin-user-menu-wrap">
					<button id="admin-user-toggle" class="admin-user-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="admin-user-menu">
						<img class="admin-user-icon" src="/assets/icons/user.svg" alt="" aria-hidden="true" />
						<span id="admin-user" class="admin-user"></span>
						<span class="admin-user-chevron" aria-hidden="true"></span>
					</button>
					<div id="admin-user-menu" class="admin-user-menu" hidden>
						<div class="admin-user-menu-info">
							<strong id="admin-user-menu-name"></strong>
							<span id="admin-user-menu-email"></span>
						</div>
						<button id="admin-logout" class="admin-logout-button" type="button" data-i18n="logout">ログアウト</button>
					</div>
				</div>
			</div>
		</header>

		<div class="admin-header-accent" aria-hidden="true"></div>
		<div class="admin-body">
			<aside id="admin-sidebar" class="admin-sidebar">
				<p class="admin-nav-label" data-i18n="management">管理</p>
				<nav id="admin-nav" class="admin-nav" aria-label="管理メニュー" data-i18n-aria-label="navLabel"></nav>
				<div class="admin-sidebar-footer"><a href="/" data-i18n="viewSite">サイトを表示</a></div>
			</aside>

			<button id="admin-sidebar-backdrop" class="admin-sidebar-backdrop" type="button" tabindex="-1" aria-label="管理メニューを閉じる" data-i18n-aria-label="menuCloseLabel" hidden></button>

			<main class="admin-main">
				<section class="admin-content">
					<div class="admin-page-heading">
						<h1 data-i18n="tagsPageTitle">タグ管理</h1>
						<p data-i18n="tagsPageDescription">投稿で使用するタグを管理します。</p>
					</div>

					<nav class="admin-taxonomy-tabs" aria-label="カテゴリー・タグ">
						<a class="admin-taxonomy-tab" href="/admin/categories/" data-i18n="taxonomyCategories">カテゴリー</a>
						<a class="admin-taxonomy-tab is-active" href="/admin/categories/tags/" data-i18n="taxonomyTags" aria-current="page">タグ</a>
					</nav>

					<div class="admin-tag-layout">
						<section class="admin-tag-card">
							<div class="admin-tag-card-header">
								<div>
									<h2 id="tag-form-title" data-i18n="tagCreateTitle">タグを追加</h2>
									<p data-i18n="tagBothLanguagesRequired">日本語名と韓国語名を登録します。</p>
								</div>
								<button id="tag-new-button" class="admin-tag-text-button" type="button" data-i18n="tagNew">新規</button>
							</div>

							<form id="tag-form" class="admin-tag-form">
								<div class="admin-tag-field">
									<label for="tag-name-ja" data-i18n="tagNameJapanese">日本語名</label>
									<input id="tag-name-ja" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="tagNameJapanesePlaceholder" placeholder="例：Java" />
								</div>

								<div class="admin-tag-field">
									<label for="tag-name-ko" data-i18n="tagNameKorean">韓国語名</label>
									<input id="tag-name-ko" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="tagNameKoreanPlaceholder" placeholder="예: 자바" />
								</div>

								<p id="tag-form-status" class="admin-tag-form-status" hidden></p>

								<div class="admin-tag-form-actions">
									<button id="tag-cancel-button" class="admin-tag-button" type="button" hidden data-i18n="tagCancelEdit">編集をキャンセル</button>
									<button id="tag-save-button" class="admin-tag-button admin-tag-button-primary" type="submit" data-i18n="tagAdd">追加</button>
								</div>
							</form>
						</section>

						<section class="admin-tag-card">
							<div class="admin-tag-card-header">
								<div>
									<h2 data-i18n="tagListTitle">タグ一覧</h2>
									<p data-i18n="tagFlatHint">タグは階層を持たず、複数の投稿に設定できます。</p>
								</div>
								<span id="tag-count" class="admin-tag-count">0</span>
							</div>

							<div id="tag-list-loading" class="admin-tag-empty" data-i18n="tagsLoading">タグを読み込んでいます…</div>
							<div id="tag-list-empty" class="admin-tag-empty" hidden data-i18n="tagsEmpty">タグはまだありません。</div>

							<div id="tag-table-wrap" class="admin-tag-table-wrap" hidden>
								<table class="admin-tag-table">
									<thead>
										<tr>
											<th data-i18n="tagTableName">タグ</th>
											<th data-i18n="tagTableJapanese">日本語</th>
											<th data-i18n="tagTableKorean">韓国語</th>
											<th data-i18n="tableActions">操作</th>
										</tr>
									</thead>
									<tbody id="tag-table-body"></tbody>
								</table>
							</div>
						</section>
					</div>
				</section>
			</main>
		</div>
	</div>

	<script src="/assets/js/admin/i18n.js"></script>
	<script src="/assets/js/admin/menu.js"></script>
	<script src="/assets/js/admin/layout.js"></script>
	<script src="/assets/js/admin/common.js"></script>
	<script src="/assets/js/admin/tags.js"></script>
</body>
</html>
