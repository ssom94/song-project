<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<title>Categories | SONG Admin</title>
	<link rel="stylesheet" href="/assets/css/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/common.css" />
	<link rel="stylesheet" href="/assets/css/admin/taxonomy.css" />
	<link rel="stylesheet" href="/assets/css/admin/categories.css" />
	<link rel="stylesheet" href="/assets/css/admin/categories-drag-layout.css" />
</head>
<body class="admin-page admin-categories-page" data-i18n-scope="categories">
	<div id="admin-loading" class="admin-loading" data-i18n="loading">セッションを確認しています…</div>

	<div id="admin-shell" class="admin-shell" hidden>
		<header class="admin-global-header">
			<div class="admin-header-left">
				<button id="admin-sidebar-toggle" class="admin-sidebar-toggle" type="button" aria-controls="admin-sidebar" aria-expanded="true" aria-label="管理メニューを閉じる" data-i18n-aria-label="menuCloseLabel">
					<span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
				</button>
				<a class="admin-global-brand" href="/" aria-label="Song Project ホームへ" data-i18n-aria-label="brandHomeLabel">
					<img src="/assets/logo-song-ym.png" alt="Song YM" />
					<span>SONG Admin</span>
				</a>
			</div>

			<div class="admin-header-actions">
				<div class="admin-language-switch" aria-label="表示言語" data-i18n-aria-label="languageLabel">
					<button class="is-active" type="button" data-admin-lang="ja" aria-pressed="true">日本語</button>
					<span class="admin-language-divider" aria-hidden="true">|</span>
					<button type="button" data-admin-lang="ko" aria-pressed="false">한국어</button>
				</div>
				<div class="admin-user-menu-wrap">
					<button id="admin-user-toggle" class="admin-user-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="admin-user-menu">
						<img class="admin-user-icon" src="/assets/icons/user.svg" alt="" aria-hidden="true" />
						<span id="admin-user" class="admin-user"></span>
						<span class="admin-user-chevron" aria-hidden="true"></span>
					</button>
					<div id="admin-user-menu" class="admin-user-menu" hidden>
						<div class="admin-user-menu-info">
							<strong id="admin-user-menu-name"></strong>
							<span id="admin-user-menu-email"></span>
						</div>
						<button id="admin-logout" class="admin-logout-button" type="button" data-i18n="logout">ログアウト</button>
					</div>
				</div>
			</div>
		</header>

		<div class="admin-header-accent" aria-hidden="true"></div>
		<div class="admin-body">
			<aside id="admin-sidebar" class="admin-sidebar">
				<p class="admin-nav-label" data-i18n="management">管理</p>
				<nav id="admin-nav" class="admin-nav" aria-label="管理メニュー" data-i18n-aria-label="navLabel"></nav>
				<div class="admin-sidebar-footer"><a href="/" data-i18n="viewSite">サイトを表示</a></div>
			</aside>

			<button id="admin-sidebar-backdrop" class="admin-sidebar-backdrop" type="button" tabindex="-1" aria-label="管理メニューを閉じる" data-i18n-aria-label="menuCloseLabel" hidden></button>

			<main class="admin-main">
				<section class="admin-content">
					<div class="admin-page-heading">
						<h1 data-i18n="categoriesPageTitle">カテゴリー管理</h1>
						<p data-i18n="categoriesPageDescription">投稿で使用するカテゴリーと階層を管理します。</p>
					</div>

					<nav class="admin-taxonomy-tabs" aria-label="カテゴリー・タグ">
						<a class="admin-taxonomy-tab is-active" href="/admin/categories/" data-i18n="taxonomyCategories" aria-current="page">カテゴリー</a>
						<a class="admin-taxonomy-tab" href="/admin/categories/tags/" data-i18n="taxonomyTags">タグ</a>
					</nav>

					<div class="admin-category-layout">
						<section class="admin-category-card admin-category-form-card">
							<div class="admin-category-card-header">
								<div>
									<h2 id="category-form-title" data-i18n="categoryCreateTitle">カテゴリーを追加</h2>
									<p data-i18n="categoryBothLanguagesRequired">日本語名と韓国語名を登録します。</p>
								</div>
								<button id="category-new-button" class="admin-category-text-button" type="button" data-i18n="categoryNew">新規</button>
							</div>

							<form id="category-form" class="admin-category-form">
								<div class="admin-category-field">
									<label for="category-name-ja" data-i18n="categoryNameJapanese">日本語名</label>
									<input id="category-name-ja" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="categoryNameJapanesePlaceholder" placeholder="例：開発" />
								</div>

								<div class="admin-category-field">
									<label for="category-name-ko" data-i18n="categoryNameKorean">韓国語名</label>
									<input id="category-name-ko" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="categoryNameKoreanPlaceholder" placeholder="예: 개발" />
								</div>

								<div class="admin-category-field">
									<label for="category-parent" data-i18n="categoryParent">上位カテゴリー</label>
									<select id="category-parent">
										<option value="" data-i18n="categoryTopLevel">最上位</option>
									</select>
								</div>

								<div class="admin-category-field">
									<label for="category-order" data-i18n="categoryDisplayOrder">表示順</label>
									<input id="category-order" type="number" min="0" max="9999" step="1" value="0" inputmode="numeric" />
								</div>

								<p id="category-form-status" class="admin-category-form-status" hidden></p>

								<div class="admin-category-form-actions">
									<button id="category-cancel-button" class="admin-category-button" type="button" hidden data-i18n="categoryCancelEdit">編集をキャンセル</button>
									<button id="category-save-button" class="admin-category-button admin-category-button-primary" type="submit" data-i18n="categoryAdd">追加</button>
								</div>
							</form>
						</section>

						<section class="admin-category-card admin-category-list-card">
							<div class="admin-category-card-header">
								<div>
									<h2 data-i18n="categoryListTitle">カテゴリー一覧</h2>
									<p data-i18n="categoryHierarchyHint">下位カテゴリーはインデントして表示します。</p>
								</div>
								<span id="category-count" class="admin-category-count">0</span>
							</div>

							<div id="category-list-loading" class="admin-category-empty" data-i18n="categoriesLoading">カテゴリーを読み込んでいます…</div>
							<div id="category-list-empty" class="admin-category-empty" hidden data-i18n="categoriesEmpty">カテゴリーはまだありません。</div>

							<div id="category-table-wrap" class="admin-category-table-wrap" hidden>
								<table class="admin-category-table">
									<thead>
										<tr>
											<th data-i18n="categoryTableName">カテゴリー</th>
											<th data-i18n="categoryTableJapanese">日本語</th>
											<th data-i18n="categoryTableKorean">韓国語</th>
											<th data-i18n="categoryTableOrder">順序</th>
											<th data-i18n="tableActions">操作</th>
											<th class="admin-category-drag-column-header" aria-label="並び替え"></th>
										</tr>
									</thead>
									<tbody id="category-table-body"></tbody>
								</table>
							</div>
						</section>
					</div>
				</section>
			</main>
		</div>
	</div>

	<script src="/assets/js/admin/i18n.js"></script>
	<script src="/assets/js/admin/menu.js"></script>
	<script src="/assets/js/admin/layout.js"></script>
	<script src="/assets/js/admin/common.js"></script>
	<script src="/assets/js/admin/categories.js"></script>
	<script src="/assets/js/admin/categories-drag-layout.js"></script>
</body>
</html>
