<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<title>Document Viewer | SONG</title>
	<link rel="stylesheet" href="/assets/css/common.css" />
	<link rel="stylesheet" href="/assets/css/blog/dashboard-shell.css" />
	<link rel="stylesheet" href="/assets/css/protected/common.css" />
	<link rel="stylesheet" href="/assets/css/protected/viewer.css" />
</head>
<body class="blog-dashboard-page protected-public-page">
<header class="blog-dashboard-topbar"><div class="blog-dashboard-top-actions"><a class="blog-dashboard-brand" href="/"><img src="/assets/logo-song-ym.png" alt="Song YM" /><span>Protected Viewer</span></a></div><div class="blog-dashboard-language"><a href="/protected/">Access</a><span>/</span><a href="/">Home</a></div></header>
<main class="protected-viewer-shell">
	<div id="protected-viewer-doc-tabs" class="protected-viewer-doc-tabs"></div>
	<div class="protected-viewer-layout">
		<aside class="protected-viewer-sidebar"><h2 id="protected-viewer-sheet-heading">Sheets</h2><div id="protected-viewer-sheet-list" class="protected-viewer-sheet-list"></div></aside>
		<section class="protected-viewer-main">
			<div class="protected-viewer-toolbar">
				<div class="protected-viewer-toolbar-copy"><strong id="protected-viewer-title">Document</strong><small id="protected-viewer-meta"></small></div>
				<div class="protected-viewer-toolbar-actions"><button id="protected-viewer-zoom-out" type="button">−</button><button id="protected-viewer-zoom-label" type="button">100%</button><button id="protected-viewer-zoom-in" type="button">＋</button><a id="protected-viewer-download" href="#">Excel</a></div>
			</div>
			<div class="protected-viewer-canvas"><div id="protected-viewer-page" class="protected-viewer-page">Loading…</div></div>
		</section>
	</div>
</main>
<script src="/assets/js/protected/viewer.js"></script>
</body>
