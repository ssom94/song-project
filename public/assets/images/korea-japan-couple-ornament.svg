<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="Korean Japanese couple ornament">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0cc"/><stop offset="1" stop-color="#efb99c"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#426b9d"/><stop offset="1" stop-color="#233f68"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a5b6"/><stop offset="1" stop-color="#d9758d"/></linearGradient>
    <radialGradient id="sakura"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f2a5b6"/></radialGradient>
    <radialGradient id="kiku"><stop offset="0" stop-color="#fff7c8"/><stop offset="1" stop-color="#d7b251"/></radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#64748b" flood-opacity=".13"/></filter>
  </defs>

  <g filter="url(#soft)">
    <!-- left sakura cloud -->
    <g transform="translate(8 74)" opacity=".72">
      <g transform="translate(12 -24) scale(.65)"><ellipse cy="-14" rx="10" ry="16" fill="url(#sakura)"/><ellipse cx="14" cy="-4" rx="10" ry="16" fill="url(#sakura)" transform="rotate(72 14 -4)"/><ellipse cx="9" cy="12" rx="10" ry="16" fill="url(#sakura)" transform="rotate(144 9 12)"/><ellipse cx="-9" cy="12" rx="10" ry="16" fill="url(#sakura)" transform="rotate(216 -9 12)"/><ellipse cx="-14" cy="-4" rx="10" ry="16" fill="url(#sakura)" transform="rotate(288 -14 -4)"/><circle r="4" fill="#d97890"/></g>
      <g transform="translate(42 10) scale(.45)"><ellipse cy="-14" rx="10" ry="16" fill="url(#sakura)"/><ellipse cx="14" cy="-4" rx="10" ry="16" fill="url(#sakura)" transform="rotate(72 14 -4)"/><ellipse cx="9" cy="12" rx="10" ry="16" fill="url(#sakura)" transform="rotate(144 9 12)"/><ellipse cx="-9" cy="12" rx="10" ry="16" fill="url(#sakura)" transform="rotate(216 -9 12)"/><ellipse cx="-14" cy="-4" rx="10" ry="16" fill="url(#sakura)" transform="rotate(288 -14 -4)"/><circle r="4" fill="#d97890"/></g>
    </g>

    <!-- Korean flag -->
    <g transform="translate(58 35)">
      <rect width="94" height="62" rx="9" fill="#fff" stroke="#dce4ed" stroke-width="2"/>
      <g transform="translate(47 31) scale(.19)"><path d="M0 -100 A100 100 0 0 1 0 100 A50 50 0 0 0 0 0 A50 50 0 0 1 0 -100Z" fill="#df4056"/><path d="M0 100 A100 100 0 0 1 0 -100 A50 50 0 0 0 0 0 A50 50 0 0 1 0 100Z" fill="#315fae"/></g>
      <g fill="#28374b" opacity=".82" transform="translate(11 10) scale(.18)"><rect width="48" height="7" rx="2"/><rect y="14" width="48" height="7" rx="2"/><rect y="28" width="48" height="7" rx="2"/></g>
      <g fill="#28374b" opacity=".82" transform="translate(82 51) rotate(180) scale(.18)"><rect width="48" height="7" rx="2"/><rect y="14" width="48" height="7" rx="2"/><rect y="28" width="48" height="7" rx="2"/></g>
    </g>

    <!-- male chibi -->
    <g transform="translate(165 5)">
      <path d="M25 48 C24 21 40 8 60 8 C85 8 100 24 96 54 C89 33 76 25 58 25 C43 26 33 34 25 48Z" fill="#332d2d"/>
      <circle cx="60" cy="50" r="31" fill="url(#skin)"/>
      <path d="M30 43 C33 15 89 13 94 45 C80 29 52 23 30 43Z" fill="#332d2d"/>
      <circle cx="49" cy="50" r="3.2" fill="#263447"/><circle cx="71" cy="50" r="3.2" fill="#263447"/>
      <circle cx="44" cy="58" r="5" fill="#ed9ca5" opacity=".32"/><circle cx="76" cy="58" r="5" fill="#ed9ca5" opacity=".32"/>
      <path d="M52 63 Q60 70 68 63" fill="none" stroke="#a85862" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M17 139 Q20 83 60 80 Q100 83 103 139Z" fill="url(#suit)"/>
      <path d="M43 82 L60 101 L77 82" fill="#fff" opacity=".95"/>
      <path d="M57 98 L63 98 L66 126 L54 126Z" fill="#c84755"/>
      <path d="M45 12 C57 2 78 5 86 17 C68 12 52 16 39 28 C39 21 41 16 45 12Z" fill="#2c2727"/>
    </g>

    <!-- heart -->
    <path d="M286 55 C291 43 307 44 311 56 C315 44 332 43 337 55 C344 72 311 91 311 91 C311 91 279 72 286 55Z" fill="#ef7389" opacity=".94"/>

    <!-- female chibi -->
    <g transform="translate(338 5)">
      <circle cx="60" cy="50" r="31" fill="url(#skin)"/>
      <path d="M28 47 C26 19 44 7 61 7 C86 7 99 25 93 54 C84 34 75 25 59 24 C47 25 36 32 28 47Z" fill="#3b3033"/>
      <path d="M31 42 C18 56 22 79 34 89" fill="none" stroke="#3b3033" stroke-width="10" stroke-linecap="round"/>
      <path d="M89 42 C101 57 98 79 86 89" fill="none" stroke="#3b3033" stroke-width="10" stroke-linecap="round"/>
      <circle cx="49" cy="50" r="3.2" fill="#263447"/><circle cx="71" cy="50" r="3.2" fill="#263447"/>
      <circle cx="44" cy="58" r="5" fill="#ed9ca5" opacity=".36"/><circle cx="76" cy="58" r="5" fill="#ed9ca5" opacity=".36"/>
      <path d="M52 63 Q60 70 68 63" fill="none" stroke="#a85862" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M17 139 Q20 84 60 81 Q100 84 103 139Z" fill="url(#dress)"/>
      <path d="M42 83 Q60 105 78 83" fill="#fff8f9" opacity=".96"/>
      <path d="M36 14 C48 3 70 4 83 16 C68 13 53 17 42 28 C41 21 39 17 36 14Z" fill="#3b3033"/>
      <g transform="translate(88 19) scale(.46)"><ellipse cy="-14" rx="10" ry="16" fill="url(#sakura)"/><ellipse cx="14" cy="-4" rx="10" ry="16" fill="url(#sakura)" transform="rotate(72 14 -4)"/><ellipse cx="9" cy="12" rx="10" ry="16" fill="url(#sakura)" transform="rotate(144 9 12)"/><ellipse cx="-9" cy="12" rx="10" ry="16" fill="url(#sakura)" transform="rotate(216 -9 12)"/><ellipse cx="-14" cy="-4" rx="10" ry="16" fill="url(#sakura)" transform="rotate(288 -14 -4)"/><circle r="4" fill="#d97890"/></g>
    </g>

    <!-- chrysanthemum -->
    <g transform="translate(486 68) scale(.48)">
      <g fill="url(#kiku)" stroke="#c8a446" stroke-width="1"><ellipse cy="-40" rx="11" ry="31"/><ellipse cy="40" rx="11" ry="31"/><ellipse cx="40" rx="31" ry="11"/><ellipse cx="-40" rx="31" ry="11"/><ellipse cx="28" cy="-28" rx="11" ry="31" transform="rotate(45 28 -28)"/><ellipse cx="-28" cy="28" rx="11" ry="31" transform="rotate(45 -28 28)"/><ellipse cx="-28" cy="-28" rx="11" ry="31" transform="rotate(-45 -28 -28)"/><ellipse cx="28" cy="28" rx="11" ry="31" transform="rotate(-45 28 28)"/></g><circle r="14" fill="#d7b04e"/>
    </g>

    <!-- Japanese flag -->
    <g transform="translate(532 35)"><rect width="78" height="62" rx="9" fill="#fff" stroke="#dce4ed" stroke-width="2"/><circle cx="39" cy="31" r="18" fill="#df334b"/></g>

    <!-- floral dust -->
    <g fill="#ef9fb0" opacity=".50"><ellipse cx="26" cy="32" rx="5" ry="10" transform="rotate(25 26 32)"/><ellipse cx="145" cy="18" rx="4" ry="8" transform="rotate(-25 145 18)"/><ellipse cx="518" cy="25" rx="4" ry="8" transform="rotate(22 518 25)"/><ellipse cx="612" cy="72" rx="4" ry="9" transform="rotate(-28 612 72)"/></g>
  </g>
</svg>