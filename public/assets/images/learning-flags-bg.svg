<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-label="Soft Korean Japanese floral background">
  <defs>
    <linearGradient id="blueWave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8d0f5" stop-opacity=".05"/><stop offset=".42" stop-color="#78a2e7" stop-opacity=".28"/><stop offset="1" stop-color="#6c93d9" stop-opacity=".05"/></linearGradient>
    <linearGradient id="redWave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4b7c3" stop-opacity=".04"/><stop offset=".46" stop-color="#ec8496" stop-opacity=".24"/><stop offset="1" stop-color="#f2a9b7" stop-opacity=".04"/></linearGradient>
    <radialGradient id="mugu" cx="50%" cy="42%" r="72%"><stop offset="0" stop-color="#fff"/><stop offset=".68" stop-color="#f7cbd7"/><stop offset="1" stop-color="#e997ab"/></radialGradient>
    <radialGradient id="kiku" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#fff8d2"/><stop offset=".65" stop-color="#e9cf82"/><stop offset="1" stop-color="#caa853"/></radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#64748b" flood-opacity=".10"/></filter>
  </defs>

  <circle cx="250" cy="200" r="280" fill="#78a5e6" opacity=".025"/>
  <circle cx="1570" cy="820" r="350" fill="#eb7b8f" opacity=".03"/>

  <!-- broad, quiet red/blue ribbons -->
  <path d="M-130 520 C160 380 390 610 680 485 C970 360 1170 425 1430 290 C1600 205 1740 215 1900 250" fill="none" stroke="url(#blueWave)" stroke-width="70" stroke-linecap="round"/>
  <path d="M-140 585 C155 445 410 670 700 540 C985 412 1195 475 1455 348 C1620 268 1760 275 1900 310" fill="none" stroke="url(#redWave)" stroke-width="50" stroke-linecap="round"/>
  <path d="M-110 635 C180 525 430 730 735 600 C1010 485 1245 540 1490 430 C1650 358 1780 365 1900 390" fill="none" stroke="#fff" stroke-opacity=".48" stroke-width="36" stroke-linecap="round"/>

  <!-- left Mugunghwa cluster -->
  <g transform="translate(28 42) scale(.72)" filter="url(#shadow)" opacity=".76">
    <path d="M62 280 C145 205 220 126 306 38" fill="none" stroke="#7a9775" stroke-width="10" stroke-linecap="round"/>
    <path d="M145 212 C105 173 78 133 57 92" fill="none" stroke="#7a9775" stroke-width="7" stroke-linecap="round"/>
    <g fill="#89a381" opacity=".9"><ellipse cx="92" cy="238" rx="38" ry="16" transform="rotate(-24 92 238)"/><ellipse cx="137" cy="180" rx="34" ry="15" transform="rotate(28 137 180)"/><ellipse cx="244" cy="92" rx="40" ry="17" transform="rotate(-18 244 92)"/></g>
    <g transform="translate(130 98)"><ellipse cy="-52" rx="42" ry="65" fill="url(#mugu)"/><ellipse cx="50" cy="-17" rx="42" ry="65" fill="url(#mugu)" transform="rotate(72 50 -17)"/><ellipse cx="31" cy="46" rx="42" ry="65" fill="url(#mugu)" transform="rotate(144 31 46)"/><ellipse cx="-33" cy="46" rx="42" ry="65" fill="url(#mugu)" transform="rotate(216 -33 46)"/><ellipse cx="-50" cy="-17" rx="42" ry="65" fill="url(#mugu)" transform="rotate(288 -50 -17)"/><circle r="22" fill="#cf607b" opacity=".72"/><path d="M0 0 C20 18 33 43 49 77" fill="none" stroke="#d65f79" stroke-width="7" stroke-linecap="round"/><g fill="#efd166"><circle cx="49" cy="78" r="5"/><circle cx="55" cy="86" r="4"/><circle cx="42" cy="88" r="4"/></g></g>
    <g transform="translate(283 164) scale(.58)"><ellipse cy="-52" rx="42" ry="65" fill="url(#mugu)"/><ellipse cx="50" cy="-17" rx="42" ry="65" fill="url(#mugu)" transform="rotate(72 50 -17)"/><ellipse cx="31" cy="46" rx="42" ry="65" fill="url(#mugu)" transform="rotate(144 31 46)"/><ellipse cx="-33" cy="46" rx="42" ry="65" fill="url(#mugu)" transform="rotate(216 -33 46)"/><ellipse cx="-50" cy="-17" rx="42" ry="65" fill="url(#mugu)" transform="rotate(288 -50 -17)"/><circle r="22" fill="#cf607b" opacity=".68"/></g>
  </g>

  <!-- soft Japanese chrysanthemum, lower right -->
  <g transform="translate(1660 840) scale(.72)" opacity=".20" filter="url(#shadow)">
    <g fill="url(#kiku)" stroke="#c7a34d" stroke-width="2"><ellipse cy="-76" rx="20" ry="62"/><ellipse cy="76" rx="20" ry="62"/><ellipse cx="76" rx="62" ry="20"/><ellipse cx="-76" rx="62" ry="20"/><ellipse cx="54" cy="-54" rx="20" ry="62" transform="rotate(45 54 -54)"/><ellipse cx="-54" cy="54" rx="20" ry="62" transform="rotate(45 -54 54)"/><ellipse cx="-54" cy="-54" rx="20" ry="62" transform="rotate(-45 -54 -54)"/><ellipse cx="54" cy="54" rx="20" ry="62" transform="rotate(-45 54 54)"/></g><circle r="28" fill="#d3ae50" opacity=".8"/>
  </g>

  <!-- a few pale petals -->
  <g fill="#efa2b2" opacity=".28"><ellipse cx="320" cy="255" rx="8" ry="17" transform="rotate(38 320 255)"/><ellipse cx="455" cy="335" rx="7" ry="14" transform="rotate(-26 455 335)"/><ellipse cx="1370" cy="270" rx="8" ry="16" transform="rotate(30 1370 270)"/><ellipse cx="1540" cy="545" rx="8" ry="17" transform="rotate(-35 1540 545)"/><ellipse cx="1260" cy="800" rx="7" ry="14" transform="rotate(20 1260 800)"/></g>
</svg>