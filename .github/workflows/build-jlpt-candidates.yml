name: Build JLPT N1 candidates

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jlpt/prepare-production-candidates.mjs'
      - 'scripts/jlpt/enrich-from-krdict.py'
      - 'scripts/jlpt/build-word-enrichment-drafts.mjs'
      - '.github/workflows/build-jlpt-candidates.yml'
      - 'data/jlpt/production/sources.json'
      - 'data/jlpt/daily_words/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-jlpt-n1-candidates
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout song-project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup recoverable XML parser
        run: python3 -m pip install --disable-pip-version-check --quiet 'lxml==6.0.1'

      - name: Build deterministic 3,000-word candidate set
        run: node scripts/jlpt/prepare-production-candidates.mjs

      - name: Checkout pinned Korean Learners Dictionary data
        uses: actions/checkout@v4
        with:
          repository: spellcheck-ko/korean-dict-nikl
          ref: 42c0d01889f34536e9cf94fe57f62bd2055b1bde
          path: .cache/korean-dict-nikl
          sparse-checkout: krdict
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Reverse-match official Japanese translations to Korean glosses
        run: python3 scripts/jlpt/enrich-from-krdict.py --krdict-dir .cache/korean-dict-nikl/krdict

      - name: Merge source-backed glosses and existing curated examples into review drafts
        run: node scripts/jlpt/build-word-enrichment-drafts.mjs

      - name: Commit generated candidate artifacts
        run: |
          if [ -z "$(git status --porcelain -- data/jlpt/production/candidates)" ]; then
            echo 'No candidate changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jlpt/production/candidates
          git commit -m 'data: refresh JLPT N1 candidate enrichment'
          git pull --rebase origin main
          git push
