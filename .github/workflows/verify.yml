name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        id: tsc
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc -p tsconfig.json 2>&1 | tee tsc.log

      - name: Upload TypeScript log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-log
          path: tsc.log
          if-no-files-found: error

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test -- --run

      - name: Apply local D1 migrations
        id: migrations
        continue-on-error: true
        run: npm run db:migrate:local

      - name: Verify seeded catalog and posts
        id: seedcheck
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DB_FILE="$(find .wrangler -type f -name '*.sqlite' | head -n 1)"
          test -n "$DB_FILE"

          CERT_COUNT="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM certifications;')"
          TEAMLAB_POSTS="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM posts WHERE id BETWEEN 810000001 AND 810000009;')"
          TEAMLAB_TRANSLATIONS="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM post_translations WHERE post_id BETWEEN 810000001 AND 810000009;')"
          TEAMLAB_REVISIONS="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM post_revisions WHERE post_id BETWEEN 810000001 AND 810000009;')"
          SKILL_CATALOG="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM it_skill_catalog;')"

          echo "certifications=$CERT_COUNT"
          echo "teamlab_posts=$TEAMLAB_POSTS"
          echo "teamlab_translations=$TEAMLAB_TRANSLATIONS"
          echo "teamlab_revisions=$TEAMLAB_REVISIONS"
          echo "skill_catalog=$SKILL_CATALOG"

          test "$CERT_COUNT" -eq 5
          test "$TEAMLAB_POSTS" -eq 9
          test "$TEAMLAB_TRANSLATIONS" -eq 18
          test "$TEAMLAB_REVISIONS" -eq 18
          test "$SKILL_CATALOG" -ge 100

      - name: Final verification result
        if: always()
        shell: bash
        run: |
          echo "tsc=${{ steps.tsc.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "migrations=${{ steps.migrations.outcome }}"
          echo "seedcheck=${{ steps.seedcheck.outcome }}"
          test "${{ steps.tsc.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.migrations.outcome }}" = "success"
          test "${{ steps.seedcheck.outcome }}" = "success"
