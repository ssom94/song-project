name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.json

      - name: Browser JavaScript syntax check
        run: |
          node --check public/assets/js/blog/dashboard-shell.js
          node --check public/assets/js/blog/certifications-list.js
          node --check public/assets/js/blog/certification-detail.js
          node --check public/assets/js/admin/japanese-workspace.js
          node --check public/assets/js/admin/japanese-timestamps.js
          node --check public/assets/js/admin/japanese-import.js
          node --check public/assets/js/admin/japanese-import-provenance.js
          node --check public/assets/js/japanese/jlpt-dashboard.js
          node --check public/assets/js/japanese/jlpt-page-enhancements.js
          node --check public/assets/js/japanese/jlpt-experience.js
          node --check public/assets/js/japanese/study-history.js
          node --check public/assets/js/japanese/today-study-float.js
          node --check public/assets/js/japanese/today-study-float-v3.js
          node --check public/assets/js/japanese/word-detail.js
          node --check public/assets/js/japanese/word-memory-mode.js
          node --check public/assets/js/japanese/quiz-scope-bootstrap.js
          node --check public/assets/js/korean/study-page.js
          node --check public/assets/js/study/ap.js
          node --check public/assets/js/study/ap-vocabulary.js
          node --check public/assets/js/study/ap-vocabulary-wrong.js
          node --check public/assets/js/study-export.js

      - name: Unit tests
        run: npm test -- --run

      - name: Apply local D1 migrations
        shell: bash
        run: |
          set -o pipefail
          npm run db:migrate:local 2>&1 | tee migration.log

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log
          path: migration.log
          if-no-files-found: error

      - name: Verify seeded catalog and study schemas
        shell: bash
        run: |
          set -euo pipefail

          DB_FILE=""
          while IFS= read -r candidate; do
            if [ "$(sqlite3 "$candidate" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='certifications';")" = "1" ]; then
              DB_FILE="$candidate"
              break
            fi
          done < <(find .wrangler -type f -name '*.sqlite' -print)

          test -n "$DB_FILE"
          echo "d1_file=$DB_FILE"

          CERT_COUNT="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM certifications;')"
          CERT_TOPIC_COUNT="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM certification_topics;')"
          TEAMLAB_POSTS="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM posts WHERE id BETWEEN 810000001 AND 810000009;')"
          TEAMLAB_TRANSLATIONS="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM post_translations WHERE post_id BETWEEN 810000001 AND 810000009;')"
          TEAMLAB_REVISIONS="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM post_revisions WHERE post_id BETWEEN 810000001 AND 810000009;')"
          SKILL_CATALOG="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM it_skill_catalog;')"
          JLPT_PLANS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='japanese_jlpt_study_plans';")"
          JLPT_CONTENTS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='japanese_jlpt_daily_contents';")"
          JLPT_ATTEMPTS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='japanese_jlpt_question_attempts';")"
          JLPT_WRONG_NOTES="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='japanese_jlpt_wrong_notes';")"
          JLPT_REVIEW_COLUMNS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM pragma_table_info('japanese_admin_word_learning_stats') WHERE name IN ('first_learned_at','last_studied_at','review_stage','next_review_on');")"
          JLPT_DAY1_EXAMPLES="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM japanese_word_examples WHERE word_id IN (SELECT id FROM japanese_words WHERE word IN ('遂げる','滞る','損なう','著しい','促す','覆す','免れる','携わる','廃れる','培う','阻む','強いる','顧みる','怠る','乏しい','紛らわしい','夥しい','円滑','妥当','懸念') AND deleted_at IS NULL) AND deleted_at IS NULL;")"
          KANJI_TABLE="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='japanese_kanji_korean_readings';")"
          KANJI_ROWS="$(sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM japanese_kanji_korean_readings;')"
          AP_PLANS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_study_plans';")"
          AP_TOPICS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_study_topics';")"
          AP_PROGRESS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_topic_progress';")"
          AP_SESSIONS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_daily_sessions';")"
          AP_ITEMS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_daily_items';")"
          AP_ATTEMPTS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_study_attempts';")"
          AP_VOCAB="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_vocabulary';")"
          AP_VOCAB_ATTEMPTS="$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='ap_vocabulary_quiz_attempts';")"

          echo "certifications=$CERT_COUNT"
          echo "certification_topics=$CERT_TOPIC_COUNT"
          echo "teamlab_posts=$TEAMLAB_POSTS"
          echo "teamlab_translations=$TEAMLAB_TRANSLATIONS"
          echo "teamlab_revisions=$TEAMLAB_REVISIONS"
          echo "skill_catalog=$SKILL_CATALOG"
          echo "jlpt_plans_table=$JLPT_PLANS"
          echo "jlpt_contents_table=$JLPT_CONTENTS"
          echo "jlpt_attempts_table=$JLPT_ATTEMPTS"
          echo "jlpt_wrong_notes_table=$JLPT_WRONG_NOTES"
          echo "jlpt_review_columns=$JLPT_REVIEW_COLUMNS"
          echo "jlpt_day1_examples=$JLPT_DAY1_EXAMPLES"
          echo "kanji_table=$KANJI_TABLE"
          echo "kanji_rows=$KANJI_ROWS"
          echo "ap_plans_table=$AP_PLANS"
          echo "ap_topics_table=$AP_TOPICS"
          echo "ap_progress_table=$AP_PROGRESS"
          echo "ap_sessions_table=$AP_SESSIONS"
          echo "ap_items_table=$AP_ITEMS"
          echo "ap_attempts_table=$AP_ATTEMPTS"
          echo "ap_vocabulary_table=$AP_VOCAB"
          echo "ap_vocabulary_attempts_table=$AP_VOCAB_ATTEMPTS"

          test "$CERT_COUNT" -eq 5
          test "$CERT_TOPIC_COUNT" -gt 0
          test "$TEAMLAB_POSTS" -eq 9
          test "$TEAMLAB_TRANSLATIONS" -eq 18
          test "$TEAMLAB_REVISIONS" -eq 18
          test "$SKILL_CATALOG" -eq 421
          test "$JLPT_PLANS" -eq 1
          test "$JLPT_CONTENTS" -eq 1
          test "$JLPT_ATTEMPTS" -eq 1
          test "$JLPT_WRONG_NOTES" -eq 1
          test "$JLPT_REVIEW_COLUMNS" -eq 4
          test "$JLPT_DAY1_EXAMPLES" -ge 20
          test "$KANJI_TABLE" -eq 1
          test "$KANJI_ROWS" -ge 23
          test "$AP_PLANS" -eq 1
          test "$AP_TOPICS" -eq 1
          test "$AP_PROGRESS" -eq 1
          test "$AP_SESSIONS" -eq 1
          test "$AP_ITEMS" -eq 1
          test "$AP_ATTEMPTS" -eq 1
          test "$AP_VOCAB" -eq 1
          test "$AP_VOCAB_ATTEMPTS" -eq 1
