name: Verify AP Mock Exams

on:
  push:
    branches: [main]
    paths:
      - 'data/ap/mock-exams/**'
      - 'data/ap/past-exams/**'
      - 'scripts/ap/**'
      - 'src/ap-mock-exams.ts'
      - 'public/assets/js/study/ap-mock-exams*.js'
      - 'public/assets/js/study/ap-past-exam-viewer.js'
      - 'public/assets/js/study/ap-reinforcement.js'
      - 'public/assets/js/study/ap-b-*.js'
      - 'public/assets/js/study/ap-mock-past-analysis-b-5sessions.js'
      - 'public/assets/css/study/ap-mock-exams.css'
      - 'public/assets/css/study/ap-past-exam-*.css'
      - 'public/assets/data/ap-past-exams.json'
      - 'public/assets/data/ap-reinforcement/**'
      - 'public/ko/study/ap/mock-exams/**'
      - 'public/ja/study/ap/mock-exams/**'
      - 'public/ko/study/ap/past-exams/**'
      - 'public/ja/study/ap/past-exams/**'
      - 'public/ko/study/ap/reinforcement/**'
      - 'public/ja/study/ap/reinforcement/**'
      - 'migrations/0076_ap_mock_exam_foundation.sql'
      - 'migrations/0077_ap_mock_exam_structured_written_answers.sql'
      - 'migrations/0085_ap_mock_exam_round04_shells.sql'
      - 'migrations/0086_ap_mock_exam_a04_questions.sql'
      - 'migrations/0087_ap_mock_exam_b04_questions.sql'
      - 'migrations/0088_ap_mock_exam_round05_shells.sql'
      - 'migrations/0089_ap_mock_exam_a05_questions.sql'
      - 'migrations/0090_ap_mock_exam_b05_questions.sql'
      - 'migrations/0091_ap_mock_exam_round06_shells.sql'
      - 'migrations/0092_ap_mock_exam_a06_questions.sql'
      - 'migrations/0093_ap_mock_exam_b06_questions.sql'
      - 'migrations/0094_ap_mock_exam_round07_shells.sql'
      - 'migrations/0095_ap_mock_exam_a07_questions.sql'
      - 'migrations/0096_ap_mock_exam_b07_questions.sql'
      - 'package.json'
      - '.github/workflows/verify-ap-mock-exams.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/ap/mock-exams/**'
      - 'data/ap/past-exams/**'
      - 'scripts/ap/**'
      - 'src/ap-mock-exams.ts'
      - 'public/assets/js/study/ap-mock-exams*.js'
      - 'public/assets/js/study/ap-past-exam-viewer.js'
      - 'public/assets/js/study/ap-reinforcement.js'
      - 'public/assets/js/study/ap-b-*.js'
      - 'public/assets/js/study/ap-mock-past-analysis-b-5sessions.js'
      - 'public/assets/css/study/ap-mock-exams.css'
      - 'public/assets/css/study/ap-past-exam-*.css'
      - 'public/assets/data/ap-past-exams.json'
      - 'public/assets/data/ap-reinforcement/**'
      - 'public/ko/study/ap/mock-exams/**'
      - 'public/ja/study/ap/mock-exams/**'
      - 'public/ko/study/ap/past-exams/**'
      - 'public/ja/study/ap/past-exams/**'
      - 'public/ko/study/ap/reinforcement/**'
      - 'public/ja/study/ap/reinforcement/**'
      - 'migrations/0076_ap_mock_exam_foundation.sql'
      - 'migrations/0077_ap_mock_exam_structured_written_answers.sql'
      - 'migrations/0085_ap_mock_exam_round04_shells.sql'
      - 'migrations/0086_ap_mock_exam_a04_questions.sql'
      - 'migrations/0087_ap_mock_exam_b04_questions.sql'
      - 'migrations/0088_ap_mock_exam_round05_shells.sql'
      - 'migrations/0089_ap_mock_exam_a05_questions.sql'
      - 'migrations/0090_ap_mock_exam_b05_questions.sql'
      - 'migrations/0091_ap_mock_exam_round06_shells.sql'
      - 'migrations/0092_ap_mock_exam_a06_questions.sql'
      - 'migrations/0093_ap_mock_exam_b06_questions.sql'
      - 'migrations/0094_ap_mock_exam_round07_shells.sql'
      - 'migrations/0095_ap_mock_exam_a07_questions.sql'
      - 'migrations/0096_ap_mock_exam_b07_questions.sql'
      - 'package.json'
      - '.github/workflows/verify-ap-mock-exams.yml'
  workflow_dispatch:

jobs:
  verify-ap-mock-exams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check mock and past exam browser scripts
        run: |
          node --check public/assets/js/study/ap-mock-exams-list.js
          node --check public/assets/js/study/ap-mock-exams-submit-guard.js
          node --check public/assets/js/study/ap-mock-exams.js
          node --check public/assets/js/study/ap-past-exam-viewer.js
          node --check public/assets/js/study/ap-reinforcement.js
          node --check public/assets/js/study/ap-mock-past-analysis-b-5sessions.js
          node --check public/assets/js/study/ap-b-reinforcement-entry.js
          node --check public/assets/js/study/ap-b-selection-strategy.js

      - name: Validate official past exam catalog
        run: npm run ap:past:validate

      - name: Check past versus mock comparison pipeline
        run: npm run ap:past:compare

      - name: Validate calibration and reinforcement sets
        run: node scripts/ap/validate-reinforcement.mjs

      - name: Validate all fourteen original mock exam rounds
        run: npm run ap:validate-mock-exams

      - name: Build all mock exam migrations
        run: npm run ap:mock:build

      - name: Verify generated migrations
        run: |
          test -s migrations/0078_ap_mock_exam_a01_questions.sql
          test -s migrations/0079_ap_mock_exam_b01_questions.sql
          test -s migrations/0080_ap_mock_exam_a02_questions.sql
          test -s migrations/0081_ap_mock_exam_b02_questions.sql
          test -s migrations/0082_ap_mock_exam_a03_questions.sql
          test -s migrations/0083_ap_mock_exam_b03_questions.sql
          test -s migrations/0085_ap_mock_exam_round04_shells.sql
          test -s migrations/0086_ap_mock_exam_a04_questions.sql
          test -s migrations/0087_ap_mock_exam_b04_questions.sql
          test -s migrations/0088_ap_mock_exam_round05_shells.sql
          test -s migrations/0089_ap_mock_exam_a05_questions.sql
          test -s migrations/0090_ap_mock_exam_b05_questions.sql
          test -s migrations/0091_ap_mock_exam_round06_shells.sql
          test -s migrations/0092_ap_mock_exam_a06_questions.sql
          test -s migrations/0093_ap_mock_exam_b06_questions.sql
          test -s migrations/0094_ap_mock_exam_round07_shells.sql
          test -s migrations/0095_ap_mock_exam_a07_questions.sql
          test -s migrations/0096_ap_mock_exam_b07_questions.sql
